[package]
name = "danqing-log"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "丹青日志 LogLens —— 大文件日志/JSONL 查看分析器 (第四件产品)"
license = "MIT OR Apache-2.0"

[dependencies]
# 提交状态固定为 git 依赖 (全家同一约定):
# 仓库自洽 + Cargo.lock 钉 rev 保可复现; 本机经下方 [patch] 段透明使用本地副本。
danqing = { git = "https://github.com/14uncle/danqing", features = ["update"] }
# 日志文件引擎 (mmap + 行步进索引 + 全文正则搜索 + JSONL 列化, 兄弟 crate)
danqing-logfile = { git = "https://github.com/14uncle/danqing-logfile" }
log = "0.4"
anyhow = "1"
memmap2 = "0.9"
memchr = "2"
regex = "1"
# preserve_order: Object 底层换 IndexMap 保插入序, 列发现的「首见顺序」才有意义
serde_json = { version = "1", features = ["preserve_order"] }
open = "5"
rfd = "0.15"
dirs = "6"
# 授权 key 离线校验 (SPEC-v1x-licensing D2): Ed25519 签名验签 + base64url 编解码。
# verify-only 用法, 不引入任何网络能力; 私钥永不入库 (keygen 从仓库外路径读入)。
ed25519-dalek = "2"
base64 = "0.22"
getrandom = "0.2"
# 微软商店 IAP (SPEC-v1x-licensing T5): **不设编译期 feature** —— 商店版与便携版
# 是同一个二进制, 运行时用 danqing::platform::is_packaged() 分流 (D1;
# pomodoro freemium 三构建是前车之鉴)。features 与 pomodoro 实测成稿一致:
# Win32_UI_Shell/WinRT = 购买对话框属主绑定 (IInitializeWithWindow) + COM 单元初始化;
# Win32_UI_WindowsAndMessaging = EnumWindows 定位本进程主窗口。
[dependencies.windows]
version = "0.61"
features = [
    "Services_Store",
    "ApplicationModel",
    "Win32_Foundation",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
# 购买流程按 InAppOfferToken 在商店目录定位 add-on 时需命名 IIterable 类型
# (本是 windows 的传递依赖, 提升为直接依赖 —— pomodoro 同款处理)
[dependencies.windows-collections]
version = "0.2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = "debuginfo"

[build-dependencies]
winresource = "0.1"

# 本地联动开发的 [patch] 段**已移出本文件** —— 提交进仓库的 Cargo.toml 必须
# 保持「纯 git 依赖」，否则外部克隆会因 patch 指向仓库外的 ../danqing 而构建不了。
# 本机联动改由 .cargo/config.toml (已 gitignore) 提供同款 [patch]，RustRover/cargo
# 自动读取，日常开发无感。详见 CLAUDE.md「依赖关系」。
